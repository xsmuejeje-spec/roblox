<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Practica 04</title>
</head>
<body class="container">
    <header>
        <center>
            <h1>Practica 04</h1>
            <p class="text-secondary">Fotos por álbum - JSONPlaceholder GET /photos</p>
        </center>
        <a href="index.html" class="btn btn-outline-primary btn-sm mb-3">Volver al inicio</a>
    </header>

    <div class="row mb-3">
        <div class="col-md-4">
            <input type="number" id="albumId" class="form-control" placeholder="Captura el albumId (1 al 100)" min="1" max="100">
        </div>
        <div class="col-md-2">
            <button class="btn btn-primary w-100" onclick="peticion()">Consultar</button>
        </div>
    </div>
    <p id="mensaje" class="text-secondary"></p>

    <table class="table table-striped align-middle" id="tabla">
        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Album ID</th>
                <th>Título</th>
                <th>Imagen</th>
            </tr>
        </thead>
        <tbody id="tbody">
        <!-- la tabla se llena de manera dinamica con la informacion que envie el API -->
        </tbody>
    </table>

    <script src="./prac4.js"></script>
</body>
</html>
