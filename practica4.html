<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href="estilos.css" rel="stylesheet">
    <title>Practica 04</title>
</head>
<body>
    <header class="encabezado">
        <h1>Practica 04</h1>
        <p>Fotos por álbum · JSONPlaceholder GET /photos</p>
    </header>

    <div class="container mb-5">
        <a href="index.html" class="btn-volver">&larr; Volver al inicio</a>
        <div class="tarjeta mt-3">
            <div class="row g-2 mb-2">
                <div class="col-md-4">
                    <input type="number" id="albumId" class="form-control" placeholder="Captura el albumId (1 al 100)" min="1" max="100">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-rosa w-100" onclick="peticion()">Consultar</button>
                </div>
            </div>
            <p id="mensaje" class="text-secondary small"></p>

            <table class="table align-middle" id="tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Album ID</th>
                        <th>Título</th>
                        <th>Imagen</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                <!-- la tabla se llena de manera dinamica con la informacion que envie el API -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="prac4.js"></script>
</body>
</html>
